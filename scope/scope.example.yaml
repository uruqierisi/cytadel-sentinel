# Cytadel Sentinel — scope definition (EXAMPLE).
#
# Copy to scope/<name>.yaml and edit. Real scope files are gitignored.
# The scope gate is MANDATORY: nothing (recon, scan, verify) runs against any
# host not resolved as in-scope here. Exclusions ALWAYS win over inclusions.
#
# Secrets (session cookies/headers) are NEVER stored here — only the NAME of the
# environment variable that holds them.

name: "acme-web"
authorized_by: "security@company"
authorization_ref: "TICKET-123"

in_scope:
  # Wildcards supported: "*.acme.com" matches app.acme.com, api.acme.com, etc.
  # (a bare "*.acme.com" does NOT match the apex "acme.com" — list it explicitly).
  domains:
    - "app.acme.com"
    - "*.acme.com"
  urls:
    - "https://app.acme.com"

exclusions:
  # Excluded domains are hard-rejected even if they match an in_scope wildcard.
  domains:
    - "status.acme.com"
  # Excluded paths block URLs whose path starts with any of these prefixes.
  paths:
    - "/logout"
    - "/delete"

auth:
  # cookie | header | none
  type: "cookie"
  # Name of the ENV VAR holding the session material (value read at runtime).
  # For type: cookie  -> a Cookie header value, e.g. "session=abc; csrf=def"
  # For type: header  -> a full header line, e.g. "Authorization: Bearer <jwt>"
  session: "SENTINEL_SESSION_COOKIE"

# Global politeness cap applied to active scanners (requests/sec).
rate_limit_rps: 10

# Destructive checks (stacked SQLi, write/delete payloads) stay OFF unless this
# is true AND the CLI is invoked with --allow-destructive. Both gates required.
allow_destructive: false

# Known param URLs to inject DIRECTLY, bypassing recon discovery. Use this for
# SPAs/APIs whose client-side or API routes katana/gau can't crawl (so they never
# reach sqlmap/dalfox otherwise), e.g. Juice Shop's search API.
#
# IMPORTANT — VALUE HANDLING:
#   * DISCOVERED params (from crawl/wayback) have their value NORMALIZED to "1"
#     (e.g. ?tfSearch=1) for deterministic dedupe. Boolean-based blind SQLi / XSS
#     detection often needs a value that returns REAL results, which "1" may not.
#   * SEED params here keep their value VERBATIM. So for a known-vulnerable
#     endpoint, seed it with a realistic value (?q=apple, not ?q=1) — sqlmap and
#     dalfox will fuzz that exact value.
# Each seed URL is still scope-gated and signature-deduped like a discovered one.
# seed_param_urls:
#   - "http://127.0.0.1:3000/rest/products/search?q=apple"

# OpenAPI/Swagger spec URLs to import (WP2). Endpoints (with methods + example
# values) enter the injection set. Common locations (/swagger.json,
# /openapi.json, /api-docs, /v3/api-docs) are auto-probed even without this.
# Recon also statically analyses discovered JS bundles and probes /graphql, so
# an API/SPA target yields injection candidates WITHOUT manual seeds.
# openapi_urls:
#   - "http://127.0.0.1:3000/api-docs/swagger.json"

# --- WP6 Engagement governance ------------------------------------------------
# Client/organisation name (report header + ROE).
# client: "Acme Corp"
#
# Target environment. Destructive testing against "production" requires the extra
# --i-understand-production CLI flag; otherwise injection is skipped and noted.
environment: "staging"      # staging | production
#
# Authorization WINDOW — a destructive run REFUSES to start (AUTHZ_REJECTED)
# outside [start, end]. ISO-8601 datetimes.
# authorization_window:
#   start: "2026-08-18T20:00:00Z"
#   end:   "2026-08-19T06:00:00Z"
#
# Rules-of-Engagement scan window — destructive scanning is refused outside these
# allowed weekdays (0=Sun..6=Sat) / hour range [start_hour, end_hour).
# scan_window:
#   days: [1, 2, 3, 4, 5]     # Mon–Fri
#   start_hour: 20            # 20:00
#   end_hour: 24             # midnight
#
# Client emergency contact (report + ROE).
# emergency_contact: "ops@acme.com — +1-555-0100 (24/7)"
#
# Retest: diff this run's findings against a prior run id (new/present/fixed/regressed).
# retest_of: "<prior-run-id>"
